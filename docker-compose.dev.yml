services:
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: lidmanovi-fe-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_USE_POLLING=true
      # - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - .:/app
      - /app/node_modules
