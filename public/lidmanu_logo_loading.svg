    <clipPath id="logoClip">
      <use href="#logo-shape"/>
    </clipPath>

    <linearGradient id="loadingGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="currentColor" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="currentColor" stop-opacity="1"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="shineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .logo-base {
      opacity: 0.12;
    }

    .logo-loader {
      clip-path: inset(0 100% 0 0);
      animation: reveal 1.8s cubic-bezier(.22,1,.36,1) forwards;
    }

    .logo-finish {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation:
        settle .7s cubic-bezier(.22,1,.36,1) 1.55s forwards;
    }

    .shine {
      opacity: 0;
      animation: shine 0.9s ease-out 1.55s forwards;
      pointer-events: none;
    }

    @keyframes reveal {
      0% {
        clip-path: inset(0 100% 0 0);
      }
      65% {
        clip-path: inset(0 18% 0 0);
      }
      100% {
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes settle {
      0% {
        opacity: 0;
        transform: scaleX(.985) translateY(2px);
      }
      100% {
        opacity: 1;
        transform: scaleX(1) translateY(0);
      }
    }

    @keyframes shine {
      0% {
        opacity: 0;
        transform: translateX(-280px) skewX(-18deg);
      }
      20% {
        opacity: .8;
      }
      100% {
        opacity: 0;
        transform: translateX(1350px) skewX(-18deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-loader,
      .logo-finish {
        animation: none;
        clip-path: none;
        opacity: 1;
        transform: none;
      }

      .logo-base,
      .shine {
        display: none;
      }
    }
  </style>

  <use href="#logo-shape" class="logo-base"/>

  <g class="logo-loader">
    <use href="#logo-shape" fill="currentColor"/>
  </g>

  <use href="#logo-shape" class="logo-finish" fill="currentColor"/>

  <g clip-path="url(#logoClip)">
    <rect
      class="shine"
      x="-260"
      y="-120"
      width="120"
      height="700"
      fill="url(#shineGradient)"
    />
  </g>

</svg>
